name: release
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  code:
    uses: cyberuni/.github/.github/workflows/pnpm-verify.yml@main
    with:
      os: '["ubuntu-latest"]'
      skip-playwright: true
      skip-codecov: true

  publish-gate:
    uses: cyberuni/.github/.github/workflows/pnpm-publish-gate.yml@main
    needs: code
    permissions:
      contents: read
    with:
      # 2.0.0 replaces crypto-js with @noble/hashes (see .research/id-vault-design).
      # Remove this entry once 2.0.0 is published: the gate then sees it in the published version.
      allowed-new-dependencies: '@noble/hashes'

  release:
    uses: cyberuni/.github/.github/workflows/pnpm-release-changeset-oidc.yml@main
    needs: [code, publish-gate]
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      actions: write
